<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Entrar — Evo Notes | evonotes.app</title>
    <meta name="application-name" content="Evo Notes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Evo Notes">
    <link rel="apple-touch-icon" sizes="180x180" href="/evonotes/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/evonotes/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/evonotes/favicon-16x16.png">
    <link rel="manifest" href="/evonotes/manifest.json">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-[#F0F2F6] text-[#09090B] min-h-screen antialiased selection:bg-emerald-700 selection:text-white flex flex-col justify-between items-center px-4 py-8 relative overflow-x-hidden">

    <!-- Top Navigation -->
    <div class="w-full max-w-md flex justify-between items-center">
        <a href="/" class="flex items-center gap-2.5 group text-decoration-none">
            <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-[8px] bg-black text-white flex items-center justify-center p-1.5 shadow-xs group-hover:scale-105 transition-transform">
                <svg class="w-full h-full text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3.5" y="8.5" width="2" height="7" rx="1" fill="currentColor"/>
                    <rect x="7.5" y="5" width="2" height="14" rx="1" fill="currentColor"/>
                    <rect x="11" y="2.5" width="2" height="19" rx="1" fill="currentColor"/>
                    <rect x="14.5" y="5" width="2" height="14" rx="1" fill="currentColor"/>
                    <rect x="18.5" y="8.5" width="2" height="7" rx="1" fill="currentColor"/>
                </svg>
            </div>
            <span class="font-extrabold text-base tracking-tight text-zinc-950">EvoNotes</span>
        </a>

        <a href="/" class="text-xs font-semibold text-zinc-500 hover:text-zinc-950 transition">
            ← Voltar para Home
        </a>
    </div>

    <!-- Main Login Card -->
    <div class="w-full max-w-md my-auto backdrop-blur-2xl bg-white/85 rounded-3xl p-6 sm:p-8 border border-white/95 shadow-[0_16px_40px_rgba(0,0,0,0.06)]">
        
        <div class="text-center mb-6">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 mb-3">
                <span>Acesso Seguro • Evo OS</span>
            </div>
            <h1 class="text-2xl sm:text-3xl font-black text-zinc-950 tracking-tight">
                Entrar no Evo OS
            </h1>
            <p class="text-xs text-zinc-500 mt-1">
                Acesse seu Segundo Cérebro de Voz e atas executivas.
            </p>
        </div>

        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
            
            <!-- Method Toggle -->
            <div class="flex bg-zinc-100/80 p-1 rounded-xl border border-zinc-200/80 text-xs font-bold">
                <button type="button" onclick="setAuthMethod('whatsapp')" id="btn-auth-wa" class="flex-1 py-2 rounded-lg flex items-center justify-center gap-1.5 transition bg-white text-zinc-950 shadow-2xs">
                    <i class="ph-bold ph-whatsapp-logo text-emerald-600"></i>
                    <span>WhatsApp</span>
                </button>
                <button type="button" onclick="setAuthMethod('email')" id="btn-auth-email" class="flex-1 py-2 rounded-lg flex items-center justify-center gap-1.5 transition text-zinc-500 hover:text-zinc-950">
                    <i class="ph-bold ph-envelope text-blue-600"></i>
                    <span>E-mail</span>
                </button>
            </div>

            <div>
                <label id="input-label" class="block text-xs font-bold uppercase tracking-wider text-zinc-700 mb-1.5 text-left">
                    Seu WhatsApp (DDD + Número)
                </label>
                <input
                    type="tel"
                    id="identifier-input"
                    required
                    placeholder="(11) 99999-9999"
                    class="w-full rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 transition-all border border-zinc-200 bg-white/70 text-zinc-900 placeholder-zinc-400"
                />
            </div>

            <button
                type="submit"
                id="submit-btn"
                class="w-full bg-zinc-950 hover:bg-black text-white font-bold py-3.5 px-6 rounded-xl shadow-xs flex items-center justify-center gap-2 transition-all transform active:scale-98 text-sm cursor-pointer"
            >
                <span>Entrar no Dashboard</span>
                <i class="ph-bold ph-arrow-right text-emerald-400"></i>
            </button>

            <div class="text-center pt-2">
                <span class="text-xs text-zinc-500">Ainda não possui vaga VIP? </span>
                <a href="/#form" class="text-xs font-bold text-emerald-800 hover:underline">
                    Garantir 1º ano grátis
                </a>
            </div>

        </form>

    </div>

    <!-- Security Footer -->
    <div class="flex items-center gap-2 text-[11px] text-zinc-400">
        <i class="ph-bold ph-shield-check text-emerald-700 text-sm"></i>
        <span>Criptografia TLS 1.3 & Proteção de Dados LGPD</span>
    </div>

    <script>
        let currentMethod = 'whatsapp';
        function setAuthMethod(method) {
            currentMethod = method;
            const btnWa = document.getElementById('btn-auth-wa');
            const btnEmail = document.getElementById('btn-auth-email');
            const label = document.getElementById('input-label');
            const input = document.getElementById('identifier-input');

            if (method === 'whatsapp') {
                btnWa.className = 'flex-1 py-2 rounded-lg flex items-center justify-center gap-1.5 transition bg-white text-zinc-950 shadow-2xs font-bold';
                btnEmail.className = 'flex-1 py-2 rounded-lg flex items-center justify-center gap-1.5 transition text-zinc-500 hover:text-zinc-950 font-bold';
                label.innerText = 'Seu WhatsApp (DDD + Número)';
                input.type = 'tel';
                input.placeholder = '(11) 99999-9999';
            } else {
                btnEmail.className = 'flex-1 py-2 rounded-lg flex items-center justify-center gap-1.5 transition bg-white text-zinc-950 shadow-2xs font-bold';
                btnWa.className = 'flex-1 py-2 rounded-lg flex items-center justify-center gap-1.5 transition text-zinc-500 hover:text-zinc-950 font-bold';
                label.innerText = 'Seu E-mail Corporativo';
                input.type = 'email';
                input.placeholder = 'voce@empresa.com';
            }
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = '<span>Autenticando sessão...</span>';
            btn.disabled = true;

            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 600);
        }
    </script>

</body>
</html>
