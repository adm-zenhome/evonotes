[phases.setup]
nixPkgs = ["python311", "ffmpeg", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m ensurepip || true",
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install -r requirements.txt",
  "npm install || true"
]

[start]
cmd = "python3 -m uvicorn asgi:app --host 0.0.0.0 --port ${PORT:-8765}"
